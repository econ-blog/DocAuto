name: 닥터빌 라이브 세미나 블록 실행

on:
  workflow_dispatch:
    inputs:
      stay_seconds:
        description: "세미나 팝업 체류 시간(초)"
        type: string
        default: "20"
      ignore_state:
        description: "상태 파일 무시하고 전체 시도"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seminar-block
  cancel-in-progress: false

env:
  NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}

jobs:
  seminar-block:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KST 날짜/시각 설정
        run: |
          echo "KST_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "KST_HOUR=$(TZ='Asia/Seoul' date +'%H')" >> $GITHUB_ENV

      - name: 세미나 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}
          restore-keys: |
            seminar-state-${{ env.KST_DATE }}-

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          # 폰트: 결과 표 PNG의 한글·컬러 이모지 렌더링용.
          sudo apt-get install -y xvfb fonts-nanum fonts-noto-color-emoji
          fc-cache -f

      - name: 단위 테스트 실행
        continue-on-error: true
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest

      - name: credentials.json 생성
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > credentials.json

      # Step 1: Telegram Inbox 수신 (11:00 KST 런 전용)
      - name: Telegram Inbox 수신 (11시 KST 런 전용)
        if: env.KST_HOUR == '11'
        id: inbox
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --fetch

      - name: 인박스 결과 커밋 및 푸시
        if: env.KST_HOUR == '11'
        id: commit_inbox
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain quiz_answers_legacy.json intermd_answer.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers_legacy.json intermd_answer.json
            git commit -m "chore: update quiz answers from telegram inbox [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Telegram Inbox Offset 확정
        if: env.KST_HOUR == '11' && steps.inbox.outputs.next_offset != '' && steps.commit_inbox.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --confirm-offset "${{ steps.inbox.outputs.next_offset }}"

      # Step 2: 닥터빌 세미나 신청 실행
      - name: 닥터빌 세미나 신청 실행
        id: apply
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: xvfb-run -a python3 scripts/doctorville.py --account all --task seminar --headed

      # Step 3: 라이브 세미나 입장 실행
      - name: 라이브 세미나 입장 실행
        id: live
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: |
          xvfb-run -a python3 scripts/seminar_live.py --account all \
            --stay-seconds ${{ inputs.stay_seconds || '20' }} \
            --block auto \
            --state-file scripts/state/seminar_entered.json \
            ${{ inputs.ignore_state && '--ignore-state' || '' }} \
            --headed

      # Step 4: 세미나 설문조사 실행
      - name: 세미나 설문조사 실행
        id: survey
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: |
          xvfb-run -a python3 scripts/seminar_survey.py --account all \
            --state-file scripts/state/seminar_entered.json \
            --headed

      # Step 5: 블록 결과 표 전송 — 신청·입장·설문이 각자 남긴 로그를 모아 한 장으로.
      # 세 스텝이 continue-on-error라 어디서 죽어도 여기까지는 온다(always).
      # 표 전송 실패는 런 성패에 반영하지 않는다(id 없음 = 실패 집계 대상 아님).
      - name: 세미나 결과 표 전송
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/seminar_report.py

      # legacy는 승격(legacy → quiz/text)으로 줄어들기만 한다. 세 파일이 같은
      # 커밋에 들어가야 승격이 런 사이에 유실되지 않는다.
      # seminar_applied.json이 같이 커밋돼야 다음 런이 이미 신청한 세미나의 상세를
      # 다시 열지 않는다. 정리(prune)는 daily가 하루 1회 맡는다.
      - name: 설문 족보·신청 이력·실행 로그 커밋 및 푸시
        continue-on-error: true
        run: |
          BANKS="survey_quiz_answers.json survey_text_answers.json survey_answers_legacy.json seminar_applied.json logs"
          if [ -n "$(git status --porcelain $BANKS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $BANKS
            git commit -m "chore: collect survey questions, seminar applications and run log [skip ci]"
            git pull --rebase
            git push
          fi

      - name: 세미나 상태 캐시 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}

      - name: 스크린샷 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminar-block-logs-${{ github.run_number }}
          path: scripts/logs/
          if-no-files-found: ignore
          retention-days: 7

      # 앞 스텝들이 continue-on-error인 이유는 한 단계가 죽어도 나머지를 계속
      # 돌리기 위해서다. 그 부작용으로 스텝 conclusion이 success로 덮여 런이
      # 초록으로 찍혔다(2026-08-10 실측: 설문 exit 1인데 런은 success).
      # outcome은 failure로 남으므로 여기서 모아 런 전체를 실패시킨다.
      - name: 실패 집계
        if: always()
        run: |
          fail=0
          for s in "세미나 신청:${{ steps.apply.outcome }}" \
                   "라이브 입장:${{ steps.live.outcome }}" \
                   "설문조사:${{ steps.survey.outcome }}"; do
            if [ "${s##*:}" = "failure" ]; then
              echo "::error::${s%%:*} 단계 실패"
              fail=1
            fi
          done
          exit $fail
