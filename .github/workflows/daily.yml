name: 일일 의료 포털 자동화

on:
  schedule:
    - cron: '0 7 * * *'  # 매일 16:00 KST (UTC 07:00) 백스톱
  workflow_dispatch:        # 수동 실행 및 외부 cron (cron-job.org 15:00 KST)

permissions:
  contents: write

env:
  NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}

jobs:
  daily-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          # 폰트: 결과 표 PNG의 한글·컬러 이모지 렌더링용.
          sudo apt-get install -y xvfb fonts-nanum fonts-noto-color-emoji
          fc-cache -f

      - name: 단위 테스트 실행
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest

      - name: credentials.json 생성
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > credentials.json

      - name: Telegram Inbox 수신
        id: inbox
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --fetch

      - name: 인박스 결과 커밋 및 푸시
        id: commit_inbox
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain quiz_answers_legacy.json intermd_answer.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers_legacy.json intermd_answer.json
            git commit -m "chore: update quiz answers from telegram inbox [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Telegram Inbox Offset 확정
        if: steps.inbox.outputs.next_offset != '' && steps.commit_inbox.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --confirm-offset "${{ steps.inbox.outputs.next_offset }}"

      - name: 일일 자동화 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: xvfb-run -a python3 scripts/daily_runner.py --headed

      # seminar_applied.json은 여기서 두 가지로 바뀐다: 세미나 신청 기록(task_seminar)과
      # 날짜 지난 항목 정리(daily_runner의 prune_applied_file).
      - name: 퀴즈 정답·Legacy·세미나 신청 이력·실행 로그 자동 커밋
        if: always()
        run: |
          FILES="quiz_answers.json quiz_answers_legacy.json seminar_applied.json logs"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: update quiz answers bank, seminar applications and run log [skip ci]"
            git pull --rebase
            git push
          fi

      - name: 스크린샷 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: scripts/logs/
          if-no-files-found: ignore
          retention-days: 7
